<!doctype html>
<html lang="ru" data-theme="choice">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Туры по Туркменистану и умра с туркменской группой." />
    <title>Charva Travel</title>

    <!-- The loading screen. See the twin in `apps/web-global/index.html` for why the colours
         are literals; the chooser is the one dark page, so the ring is drawn on its `bg`. -->
    <style>
      html {
        background: #0d0906;
      }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0d0906;
        opacity: 1;
        transition: opacity 360ms ease;
        animation: boot-give-up 0s linear 12s forwards;
      }
      #boot[data-done] {
        opacity: 0;
      }
      #boot i {
        display: block;
        width: 46px;
        height: 46px;
        border: 2px solid rgba(253, 249, 243, 0.16);
        border-top-color: #dfa059;
        border-radius: 50%;
        animation: boot-spin 900ms linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes boot-give-up {
        to {
          opacity: 0;
          visibility: hidden;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot i {
          animation: none;
          border-right-color: #dfa059;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot"><i></i></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
