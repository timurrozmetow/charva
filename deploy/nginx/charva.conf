# ======================================================================================
# Charva Travel — five hosts, one API, one certificate.
#
#   charva-travel.com          the chooser
#   global.charva-travel.com   Charva Travel Global
#   umra.charva-travel.com     Charva Umrah
#   admin.charva-travel.com    the admin panel, and its API on the same origin (D-20)
#   api.charva-travel.com      the public API, uploads and images
#
# Install as /etc/nginx/sites-available/charva.conf, symlink into sites-enabled, and check
# with `nginx -t` before reloading. See DEPLOY.md.
#
# Two things here are load-bearing rather than conventional.
#
# The SPAs are NOT served by handing out index.html. A request for a route that is not a file
# on disk goes to the API's /shell, which reads that site's built index.html and renders the
# real <title>, description, OG tags and JSON-LD into it (decision D-4). A crawler and a
# Telegram card read HTML and run no JavaScript, and for this audience links travel through
# Telegram — a preview that unfurls as a bare URL is a link nobody taps.
#
# And the admin's API is proxied under admin.charva-travel.com/api rather than pointed at
# api.charva-travel.com (D-20). That keeps the refresh cookie SameSite=Strict and bound to the
# admin host, so it is never sent while somebody browses the public sites. The alternative —
# a cookie on Domain=.charva-travel.com — would attach an admin session to every public
# pageview on the internet.
# ======================================================================================

upstream charva_api {
    server 127.0.0.1:3002;
    keepalive 16;
}

# The head-renderer is a proxy_pass with a query string, and it repeats on three hosts.
# Everything common to it lives here; the site and origin differ and are passed at the call.
proxy_cache_path /var/cache/nginx/charva levels=1:2 keys_zone=charva_shell:8m max_size=128m
                 inactive=10m use_temp_path=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# --------------------------------------------------------------------------------------
# HTTP → HTTPS, and the ACME challenge, for every host at once
# --------------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name charva-travel.com www.charva-travel.com global.charva-travel.com
                umra.charva-travel.com admin.charva-travel.com api.charva-travel.com;

    # Left reachable over plain HTTP on purpose: this is how certbot renews with HTTP-01 if
    # the DNS plugin is ever unavailable. It is the only thing not redirected.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --------------------------------------------------------------------------------------
# Shared TLS and header policy
# --------------------------------------------------------------------------------------
# Included by every HTTPS block below. Kept in one file so a change to the cipher list or to
# HSTS cannot be applied to four hosts and forgotten on the fifth.
#
#   /etc/nginx/snippets/charva-tls.conf   — see DEPLOY.md for its contents
# --------------------------------------------------------------------------------------

# --------------------------------------------------------------------------------------
# charva-travel.com — the chooser
# --------------------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name charva-travel.com www.charva-travel.com;

    include snippets/charva-tls.conf;

    root /opt/charva/current/apps/web-choice;

    include snippets/charva-public-api.conf;

    # No `index` directive anywhere in this file. Serving index.html directly would return the
    # build's empty <head> — the whole point of /shell is that it fills it in.
    location = / {
        proxy_pass http://charva_api/api/v1/shell?site=choice&path=%2F&origin=https://charva-travel.com;
        include snippets/charva-shell.conf;
    }

    location = /robots.txt {
        proxy_pass http://charva_api/api/v1/robots.txt?site=choice&origin=https://charva-travel.com;
        include snippets/charva-shell.conf;
    }

    location = /sitemap.xml {
        proxy_pass http://charva_api/api/v1/sitemap.xml?site=choice&origin=https://charva-travel.com;
        include snippets/charva-shell.conf;
    }

    # Hashed filenames, so the content behind one can never change. A year and `immutable`
    # means a returning visitor revalidates nothing at all.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include snippets/charva-headers.conf;
        try_files $uri =404;
    }

    location / {
        try_files $uri @shell;
    }

    location @shell {
        proxy_pass http://charva_api/api/v1/shell?site=choice&path=$uri&origin=https://charva-travel.com;
        include snippets/charva-shell.conf;
    }
}

