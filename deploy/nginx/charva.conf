# --------------------------------------------------------------------------------------
# admin.charva-travel.com — the panel, and its API on the same origin
# --------------------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.charva-travel.com;

    include snippets/charva-tls.conf;
    root /opt/charva/current/apps/admin;

    # Included at the server level rather than inside the location, and that placement is the
    # whole point: the snippet sets a 60s read timeout, an upload needs 600s, and an `include`
    # is textual — both values inside one block is «"proxy_read_timeout" directive is
    # duplicate», which nginx treats as fatal for the entire configuration, not for the block.
    # From out here the location below overrides it the ordinary way, by inheritance.
    include snippets/charva-proxy.conf;

    # No crawler, ever. The panel is behind a login, but a login screen in an index is an
    # invitation, and `/docs` behind it describes every route.
    location = /robots.txt {
        add_header Content-Type text/plain always;
        include snippets/charva-headers.conf;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Same-origin API — decision D-20. This is what lets the refresh cookie be
    # SameSite=Strict and never leave this host.
    location /api/ {
        proxy_pass http://charva_api;

        # Photographs and video. The API enforces its own limits per kind; this is the outer
        # bound, and it has to sit above MAX_VIDEO_UPLOAD_MB or nginx rejects a request the
        # application would have accepted, with a 413 that says nothing useful.
        client_max_body_size 450m;

        # A 720p transcode is not a fast request. The 60s read timeout inherited from the
        # snippet above would cut it off mid-upload and leave a half-written file the API
        # never learns about.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
    }

    # The admin is a plain SPA: no crawler reads it, so no rendered head and no /shell.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include snippets/charva-headers.conf;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        include snippets/charva-headers.conf;
    }
}

# --------------------------------------------------------------------------------------
# api.charva-travel.com — the public API, uploads and images
# --------------------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.charva-travel.com;

    include snippets/charva-tls.conf;

    location = /robots.txt {
        add_header Content-Type text/plain always;
        include snippets/charva-headers.conf;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # The admin API is not reachable here. It exists on this upstream, but a session cookie
    # scoped to admin.charva-travel.com cannot be sent to this host, so anything that arrived
    # would be unauthenticated anyway — and refusing it outright keeps the two surfaces
    # visibly separate rather than accidentally equivalent.
    location /api/v1/admin/ {
        return 404;
    }

    location / {
        proxy_pass http://charva_api;
        include snippets/charva-proxy.conf;
        client_max_body_size 25m;

        # Video is served from here and must be seekable. Without byte ranges a player can
        # only start from zero, and dragging the scrubber re-downloads the file.
        proxy_force_ranges on;
        add_header Accept-Ranges bytes always;
        include snippets/charva-headers.conf;
    }
}
