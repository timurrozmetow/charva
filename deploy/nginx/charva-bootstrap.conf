# The port-80-only config, for the twenty minutes before a certificate exists.
#
# It exists to break a loop that otherwise stops the first deploy dead.
#
# `charva.conf` includes `charva-tls.conf`, which names certificate files under
# /etc/letsencrypt/live/charva-travel.com/. On a fresh machine those files are not there, so
# `nginx -t` fails and nginx will not start. But HTTP-01 works by Let's Encrypt fetching a file
# over plain HTTP from each of the six names — which needs nginx running. Config needs the
# certificate, certificate needs the config.
#
# So: enable this one first, get the certificate, then switch to `charva.conf`. Two commands
# instead of an afternoon spent commenting lines out of a file and forgetting to put one back.
#
# Nothing is proxied and no site is served. This answers the challenge and redirects
# everything else, which is all it should ever be able to do.

server {
    listen 80;
    listen [::]:80;
    server_name charva-travel.com www.charva-travel.com global.charva-travel.com
                umra.charva-travel.com admin.charva-travel.com api.charva-travel.com;

    # Must match `--webroot-path` in the certbot call. Certbot writes the token under
    # .well-known/acme-challenge/ inside this directory and Let's Encrypt reads it back.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # A redirect rather than a 404: it makes the DNS visibly correct before the certificate
    # exists. Curl any of the six names and a 301 means the record points here.
    location / {
        return 301 https://$host$request_uri;
    }
}
