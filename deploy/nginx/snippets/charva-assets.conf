# Hashed build output, served from the current release and then from everything ever deployed.
#
# Requires `set $charva_app <dir>;` in the server block before this is included — the name of
# the app's directory under both /opt/charva/current/apps and /opt/charva/shared.
#
# ---------------------------------------------------------------------------------------
# Why there is a second place to look.
#
# The HTML outlives the release it names. That is deliberate for the shell — `charva-shell.conf`
# caches it for a minute and serves it stale while the API restarts, which is what keeps the site
# up during a deploy — and the browser is told it may keep it for a minute too. But the filenames
# inside that HTML carry a content hash, and `current` is a symlink that moves the instant the
# new release is linked. So for up to a minute after every deploy, nginx handed out HTML naming
# `index-BWshxsBh.js` while `root` had already become a directory containing `index-C_ulBzkK.js`,
# and the entry script 404'd. No script, no application: a blank page, for every visitor, after
# every deploy. Measured, not theorised — a throttled run caught one.
#
# The same fault has two other faces. A reader with the page already open navigates, the router
# asks for a lazy chunk from the release they loaded, and gets a 404 — that window is as long as
# the tab stays open, and no cache expiry closes it. And a browser holding the HTML from just
# before the deploy will reload into the same hole.
#
# Purging the shell cache would fix the first and neither of the others, and would trade the
# thing the cache exists for. Keeping the old files reachable fixes all three, and it is correct
# by construction: a content-hashed name refers to exactly one body of bytes forever, so serving
# it from an older build is not staleness, it is the same file.
#
# The deploy hard-links each release's assets into /opt/charva/shared/<app>/assets before it
# moves the symlink, so the archive is a superset and this fallback is the union of every build
# still on disk. Hard links mean the archive costs nothing while a release still holds the file,
# and the deploy prunes what no release references any more.
# ---------------------------------------------------------------------------------------

location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    include snippets/charva-headers.conf;

    try_files $uri @assets_archive;
}

location @assets_archive {
    root /opt/charva/shared/$charva_app;

    # Declared again rather than inherited: `add_header` in a location cancels inheritance of
    # every header from the server block, and this location declares one. The same trap the
    # header snippet exists for.
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    include snippets/charva-headers.conf;
}
