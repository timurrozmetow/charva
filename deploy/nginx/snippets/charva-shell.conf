# The head-renderer: same proxy rules, plus a small shared cache.
#
# Every HTML request on the three public sites goes through here, so an unavailable API would
# take the whole site down rather than degrade it. The cache is what makes that survivable:
# `proxy_cache_use_stale` keeps serving the last good HTML while the API restarts during a
# deploy, and `updating` means one request refreshes it rather than all of them at once.
#
# One minute is deliberate. The head changes when an editor publishes — rare — and a stale
# minute is invisible, while a cache long enough to be worth tuning is a cache somebody has
# to remember to purge.

include snippets/charva-proxy.conf;

proxy_cache charva_shell;
proxy_cache_key "$scheme$host$uri";
proxy_cache_valid 200 404 1m;
proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
proxy_cache_background_update on;
proxy_cache_lock on;
add_header X-Cache-Status $upstream_cache_status always;
