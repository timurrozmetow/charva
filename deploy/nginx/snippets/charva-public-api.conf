# The API on the public site's own origin.
#
# `createApiClient()` in packages/contracts defaults to the relative prefix `/api/v1` (D-93), so
# every request a public SPA makes goes to the host the visitor is already on. That is the right
# design — same origin means no preflight and no second TLS handshake on a connection from
# Ashgabat — but it only works if each public host proxies `/api/` to the upstream.
#
# Without this block the request falls through to `try_files $uri @shell`, the shell answers it
# with the site's HTML and a 404, and the browser reports a JSON parse error on a page that
# renders completely empty. Every one of the three public sites was in that state on the first
# deploy: TLS valid, HTML served, not one row of content anywhere.
#
# Included at server level in each public block; the locations below apply to that host only.

# The panel's API exists on admin.charva-travel.com and nowhere else (D-20). A session cookie
# scoped to that host cannot be sent here anyway, so anything arriving would be unauthenticated —
# and refusing it outright keeps the two surfaces visibly separate rather than accidentally
# equivalent. The longer prefix wins over `/api/` below; that is how nginx chooses.
location /api/v1/admin/ {
    return 404;
}

location /api/ {
    proxy_pass http://charva_api;
    include snippets/charva-proxy.conf;

    # Forms only. Nothing on a public site uploads a file — that happens in the panel, which has
    # its own limit an order of magnitude higher.
    client_max_body_size 2m;
}
