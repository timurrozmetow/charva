# Turkish, retired — `/tr/…` goes to the Russian equivalent of the same page.
#
# Stolzl has no `Ğ ğ İ` (question Q-17), so every second Turkish word was set in two typefaces
# at once, and the owner took the language down until the foundry supplies a fuller cut. The SPA
# already redirects an unrecognised language, but that is JavaScript: a crawler asking for an
# indexed `/tr/tours` gets whatever the origin says, and after the language came out of
# `SITE_LANGS` the shell says 404. Answering here means the redirect reaches everyone —
# crawlers, link previews, and a browser with scripting off — before anything is rendered.
#
# 302 and not 301, deliberately. A permanent redirect is cached hard by browsers and tells search
# engines to replace the URL for good; this language is expected back, and a 301 issued today
# would still be redirecting long after it returned. Temporary is what «for now» actually is.
#
# The path survives: `/tr/tours` -> `/ru/tours`, `/tr` -> `/ru`. `rewrite` carries the query
# string across on its own, because the replacement contains no `?` of its own.
#
# Included by the chooser and Global. Not by Umrah, which is `tm`/`ru` and never spoke Turkish.
rewrite ^/tr(/.*)?$ /ru$1 redirect;
