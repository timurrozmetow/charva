# TLS and the headers that apply to every host.
#
# Written once and included five times, because a cipher list changed on four hosts and
# forgotten on the fifth is worse than one that was never changed at all: the report says the
# fix is deployed.
#
# The certificate is the wildcard. `*.charva-travel.com` does NOT cover the apex, so the
# certificate must carry both names — see DEPLOY.md, where certbot is asked for both.

ssl_certificate     /etc/letsencrypt/live/charva-travel.com/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/charva-travel.com/privkey.pem;
ssl_trusted_certificate /etc/letsencrypt/live/charva-travel.com/chain.pem;

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_session_timeout 1d;
ssl_session_cache shared:CharvaSSL:10m;
ssl_session_tickets off;
ssl_stapling on;
ssl_stapling_verify on;

# Two years, subdomains included. Turn this on only once all five hosts serve valid TLS: a
# browser that has seen it will refuse plain HTTP to any charva-travel.com name for two years,
# and there is no way to tell it otherwise from the server side.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;

# No camera, no microphone, no geolocation. Nothing on any of the four sites asks for them,
# and saying so is what stops an embedded third party asking on their behalf.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml application/json application/javascript
           application/xml+rss application/atom+xml image/svg+xml application/manifest+json;

# Already compressed. Recompressing a WebP or a WOFF2 spends CPU to make the file larger.
