# TLS and the headers that apply to every host.
#
# Written once and included five times, because a cipher list changed on four hosts and
# forgotten on the fifth is worse than one that was never changed at all: the report says the
# fix is deployed.
#
# One certificate carrying all six names, issued over HTTP-01 — see DEPLOY.md step 5. The
# lineage is named after the first name in the certbot call, which is why the apex goes first
# and why the path below says `charva-travel.com` rather than anything about wildcards.

ssl_certificate     /etc/letsencrypt/live/charva-travel.com/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/charva-travel.com/privkey.pem;
ssl_trusted_certificate /etc/letsencrypt/live/charva-travel.com/chain.pem;

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_session_timeout 1d;
ssl_session_cache shared:CharvaSSL:10m;
ssl_session_tickets off;

# No OCSP stapling, and not as an oversight. Let's Encrypt stopped putting a responder URL in
# its certificates and then shut the responders down; `openssl x509 -ocsp_uri` on this very
# certificate prints nothing. `ssl_stapling on` against such a certificate stalls nothing and
# protects nothing — it writes a warning into the error log at every reload and is otherwise
# inert. Configuration that cannot work is worse than absent: it reads as a property the
# server has.

# The header policy is its own snippet, because `add_header` does not survive a location that
# declares one of its own — see charva-headers.conf. Included here for everything that declares
# none, and separately by each location that does.
include snippets/charva-headers.conf;

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml application/json application/javascript
           application/xml+rss application/atom+xml image/svg+xml application/manifest+json;

# Already compressed. Recompressing a WebP or a WOFF2 spends CPU to make the file larger.
