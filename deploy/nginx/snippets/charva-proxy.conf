# What every proxy_pass to the API needs.
#
# `X-Forwarded-Proto` is the one that matters beyond bookkeeping: without it the API sees
# plain HTTP, and `request.protocol` — which the shell falls back to when building canonical
# and OG URLs — announces `http://` on a site served over TLS. Telegram then unfurls a card
# whose image is on a scheme the browser refuses to load.

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header Connection "";

# The API answers /health in single-digit milliseconds and everything else well under a
# second. Anything slower than this is stuck rather than slow.
proxy_connect_timeout 5s;
proxy_read_timeout 60s;
proxy_send_timeout 60s;
