# The header policy, in a snippet because nginx does not inherit it.
#
# `add_header` is inherited from an outer block ONLY while the inner block declares no
# `add_header` of its own. One line — `add_header X-Cache-Status …` in the shell snippet,
# `add_header Cache-Control "public, immutable"` on the asset locations — silently drops the
# whole set: HSTS, nosniff, Referrer-Policy, X-Frame-Options, Permissions-Policy. It is not an
# error and nothing logs it.
#
# So the set lives here and is included at every level that declares any header of its own.
# What the response actually carries is worth checking with `curl -I` rather than reading off
# the configuration: the first check after this went in found the API's own helmet header
# standing in for the one nginx believed it was sending.

# The API sets its own set through helmet, and it should: those apply to anything that reaches
# it directly. Through nginx they arrive alongside ours, and a response carrying two different
# `Referrer-Policy` values is not twice as safe — it is a coin toss whose rules differ per
# header (RFC 6797 says the first HSTS wins; the referrer policy list resolves to the last
# valid token). The edge decides, so the upstream's copies are dropped here.
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header X-Frame-Options;
proxy_hide_header Permissions-Policy;

# Two years, subdomains included. Turn this on only once all five hosts serve valid TLS: a
# browser that has seen it will refuse plain HTTP to any charva-travel.com name for two years,
# and there is no way to tell it otherwise from the server side.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;

# No camera, no microphone, no geolocation. Nothing on any of the four sites asks for them,
# and saying so is what stops an embedded third party asking on their behalf.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
