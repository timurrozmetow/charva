<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  * { box-sizing: border-box; }
  @font-face { font-family: 'Stolzl'; src: url('assets/stolzl_regular.otf') format('opentype'); font-weight: 400; font-display: swap; }
  @font-face { font-family: 'Stolzl'; src: url('assets/stolzl_medium.otf') format('opentype'); font-weight: 500; font-display: swap; }
  @font-face { font-family: 'Stolzl'; src: url('assets/stolzl_medium.otf') format('opentype'); font-weight: 600; font-display: swap; }
  @font-face { font-family: 'Stolzl'; src: url('assets/stolzl_bold.otf') format('opentype'); font-weight: 700; font-display: swap; }
  @font-face { font-family: 'Stolzl'; src: url('assets/stolzl_bold.otf') format('opentype'); font-weight: 800; font-display: swap; }
  html, body { margin: 0; padding: 0; background: #FAF6EF; }
  a { color: #A9722C; text-decoration: none; }
  a:hover { color: #DFA059; }
  ::selection { background: #DFA059; color: #3A2A18; }
  @keyframes navdrop { from { opacity: 0; transform: translateY(-8px) scale(.97); } to { opacity: 1; transform: none; } }
</style>
<script src="./image-slot.js"></script>
</helmet>

<div style="font-family:'Stolzl','Manrope',sans-serif;background:#FAF6EF;color:#33261B;min-width:1280px">
  <dc-import name="Charva Nav" active="gallery" hint-size="100%,96px"></dc-import>

  <div style="max-width:1480px;margin:0 auto;padding:56px 60px 0">
    <div style="display:flex;align-items:center;gap:10px;font-size:12px;color:#93806E;margin-bottom:26px">
      <a href="Charva Travel Global.dc.html" style="color:#93806E" style-hover="color:#A9722C">Главная</a>
      <span>/</span>
      <span style="color:#4A382A;font-weight:600">Галерея</span>
    </div>
    <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:60px">
      <div>
        <h1 style="font-family:'Stolzl',sans-serif;font-weight:500;font-size:64px;line-height:1.04;letter-spacing:-.02em;margin:0;max-width:620px;text-wrap:pretty">Кадры из наших поездок</h1>
        <p style="margin:24px 0 0;font-size:18px;line-height:1.65;color:#6E594A;font-weight:300;max-width:520px">248 фотографий из туров за последние три года. Все снимки сделаны нашими гидами и гостями.</p>
      </div>
      <span style="flex-shrink:0;font-size:13px;color:#93806E;font-weight:300;padding-bottom:8px">Показано {{ shownCount }} из 248</span>
    </div>

    <div style="display:flex;align-items:center;gap:9px;margin:52px 0 40px;flex-wrap:wrap;border-top:1px solid rgba(90,66,44,.12);padding-top:30px">
      <sc-for list="{{ filters }}" as="f" hint-placeholder-count="6">
        <div onClick="{{ f.pick }}" style="cursor:pointer;font-size:13px;font-weight:600;padding:11px 20px;border-radius:999px;transition:all 240ms;border:1px solid {{ f.bc }};background:{{ f.bg }};color:{{ f.fg }}">{{ f.label }}</div>
      </sc-for>
    </div>

    <div style="display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:220px;gap:16px">
      <sc-for list="{{ photos }}" as="p" hint-placeholder-count="14">
        <div style="position:relative;border-radius:20px;overflow:hidden;grid-column:{{ p.col }};grid-row:{{ p.row }}">
          <image-slot id="{{ p.slot }}" shape="rect" fit="cover" placeholder="{{ p.photo }}"></image-slot>
          <div style="position:absolute;bottom:0;left:0;right:0;z-index:3;pointer-events:none;padding:18px;background:linear-gradient(to top,rgba(38,27,18,.78),transparent)">
            <span style="font-size:12px;font-weight:600;color:#FDF9F3;letter-spacing:.02em">{{ p.caption }}</span>
          </div>
        </div>
      </sc-for>
    </div>

    <div style="margin-top:60px;display:flex;justify-content:center">
      <div style="cursor:pointer;display:inline-flex;align-items:center;gap:12px;border:1px solid rgba(90,66,44,.2);color:#33261B;font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:18px 34px;border-radius:999px;transition:all 260ms" style-hover="background:#33261B;color:#FAF6EF;border-color:#33261B">Показать ещё</div>
    </div>
  </div>

  <div style="margin-top:110px"><dc-import name="Charva Footer" hint-size="100%,460px"></dc-import></div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}">
const PHOTOS = [
  { slot: 'gl-1', cat: 'Природа', col: 'span 2', row: 'span 2', caption: 'Кратер Дарваза, Каракумы', photo: 'Кратер Дарваза ночью, крупный кадр' },
  { slot: 'gl-2', cat: 'Культура', col: 'span 1', row: 'span 1', caption: 'Ковровый узор, макро', photo: 'Ковровый узор, макро' },
  { slot: 'gl-3', cat: 'Города', col: 'span 1', row: 'span 1', caption: 'Ашхабад, белый мрамор', photo: 'Ашхабад, белый мрамор' },
  { slot: 'gl-4', cat: 'Природа', col: 'span 2', row: 'span 1', caption: 'Каньон Йангыкала на закате', photo: 'Каньон Йангыкала на закате, панорама' },
  { slot: 'gl-5', cat: 'История', col: 'span 1', row: 'span 1', caption: 'Древний Мерв', photo: 'Древний Мерв, руины' },
  { slot: 'gl-6', cat: 'Кухня', col: 'span 1', row: 'span 1', caption: 'Дограма', photo: 'Национальная еда, дограма или плов' },
  { slot: 'gl-7', cat: 'Природа', col: 'span 2', row: 'span 1', caption: 'Юрточный лагерь, ночь и звёзды', photo: 'Юрточный лагерь в Каракумах, ночь' },
  { slot: 'gl-8', cat: 'Города', col: 'span 2', row: 'span 1', caption: 'Аваза, Каспийское море', photo: 'Аваза, Каспийское море' },
  { slot: 'gl-9', cat: 'Культура', col: 'span 1', row: 'span 2', caption: 'Ахалтекинский конь', photo: 'Ахалтекинский конь, портрет вертикально' },
  { slot: 'gl-10', cat: 'Культура', col: 'span 1', row: 'span 1', caption: 'Ткачихи в Геоктепе', photo: 'Ткачихи за ковровым станком' },
  { slot: 'gl-11', cat: 'История', col: 'span 2', row: 'span 1', caption: 'Минарет Куняургенча', photo: 'Минарет Кутлуг-Тимура' },
  { slot: 'gl-12', cat: 'Кухня', col: 'span 1', row: 'span 1', caption: 'Базар Толкучка', photo: 'Восточный базар, специи' },
  { slot: 'gl-13', cat: 'Города', col: 'span 1', row: 'span 1', caption: 'Ночной Ашхабад', photo: 'Ашхабад ночью, подсветка' },
  { slot: 'gl-14', cat: 'Природа', col: 'span 2', row: 'span 1', caption: 'Копетдаг весной', photo: 'Горы Копетдаг, зелёные склоны' }
];
const CATS = ['Все', 'Природа', 'Города', 'История', 'Культура', 'Кухня'];

class Component extends DCLogic {
  state = { cat: 'Все' };

  renderVals() {
    const list = this.state.cat === 'Все' ? PHOTOS : PHOTOS.filter(p => p.cat === this.state.cat);
    return {
      shownCount: list.length,
      filters: CATS.map(c => {
        const on = this.state.cat === c;
        return {
          label: c,
          bg: on ? '#33261B' : 'transparent',
          fg: on ? '#FAF6EF' : '#4A382A',
          bc: on ? '#33261B' : 'rgba(90,66,44,.18)',
          pick: () => this.setState({ cat: c })
        };
      }),
      photos: list
    };
  }
}

</script>
</body>
</html>
